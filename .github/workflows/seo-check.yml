# PRごとに、生成ファイルが元と合っているかと、SEO・文言のルールを確かめる。
name: SEO check
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 生成ファイルが元ファイルと合っているか
        run: |
          python3 tools/build.py .
          rm -rf tools/__pycache__
          git diff --stat --exit-code || (echo "tools/pages.py を直したら python3 tools/build.py . を実行して、生成ファイルもコミットしてください"; exit 1)
      - name: SEO と文言のチェック
        run: python3 tools/seo_check.py .
      - name: Order validation, idempotency and stock transactions
        run: python3 -m unittest discover -s tools/tests -p 'test_*.py' -v
      - name: JavaScript syntax
        run: node --check shop/store.js
      - name: Install browser test runner
        run: npm install --prefix /tmp/agri-browser-test playwright@1.65.1
      - name: Mobile storefront and local order API
        env:
          PLAYWRIGHT_MODULE: /tmp/agri-browser-test/node_modules/playwright
          CHROME_PATH: /usr/bin/google-chrome
        run: |
          node tools/tests/store-browser.cjs
          node tools/tests/store-api-browser.cjs
